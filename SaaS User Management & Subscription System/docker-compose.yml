services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_management
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_dev_password
    ports:
      - "55432:5432"
    volumes:
      - saas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saas-postgres-data:
